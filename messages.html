<!DOCTYPE html>
<html>
<head>
    <title>Messages</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="chat">

    <h1>Chat</h1>

    <div class="message client">
        Client: Can you complete the website by next week?
    </div>

    <div class="message freelancer">
        Freelancer: Yes, I can complete it within 7 days.
    </div>

    <div class="message client">
        Client: Great. Please start the project.
    </div>

    <input type="text"
           id="message"
           placeholder="Type a message">

    <button onclick="sendMessage()">
        Send
    </button>

</div>

<script src="../js/script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Project Tracking</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

    <h1>Project Tracking</h1>

    <div class="tracking">

        <h2>Website Development</h2>

        <p>Status: <b>In Progress</b></p>

        <div class="progress">
            <div class="progress-bar">
                60%
            </div>
        </div>

        <p>Start Date: 10-09-2026</p>
        <p>Deadline: 30-09-2026</p>

        <button onclick="updateProgress()">
            Update Progress
        </button>

    </div>

</div>

<script src="../js/script.js"></script>

</body>
</html>
